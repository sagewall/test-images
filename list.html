<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <!--   <script type="module" src=https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js></script>
  <link rel="stylesheet" type="text/css" href=https://js.arcgis.com/calcite-components/2.13.2/calcite.css /> -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@esri/calcite-components@3.0.0-next.66/dist/calcite/calcite.esm.js"
    ></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@esri/calcite-components@3.0.0-next.66/dist/calcite/calcite.css"
    />
  </head>

  <body>
    <calcite-list
      drag-enabled
      display-mode="nested"
      selection-mode="multiple"
      group="trails"
    >
      <calcite-list-item open label="Trails" value="trails">
        <calcite-list drag-enabled group="trails" selection-mode="multiple">
          <calcite-list-item open label="Hiking trails" value="hiking-trails">
            <calcite-action
              slot="actions-end"
              icon="layer"
              text="Hiking trails layer"
            ></calcite-action>
          </calcite-list-item>
          <calcite-list-item label="Multi-use trails" value="multi-use-trails">
            <calcite-action
              slot="actions-end"
              icon="layer"
              text="Multi-use trails layer"
            ></calcite-action>
          </calcite-list-item>
          <calcite-list-item label="Boardwalks" value="boardwalks">
            <calcite-action
              slot="actions-end"
              icon="layer"
              text="Boardwalks layer"
            ></calcite-action>
          </calcite-list-item>
          <calcite-list-item
            label="Interpretive trails"
            value="interpretive-trails"
          >
            <calcite-action
              slot="actions-end"
              icon="layer"
              text="Interpretive trails layer"
            ></calcite-action>
          </calcite-list-item>
        </calcite-list>
      </calcite-list-item>
      <calcite-list-item label="Waterfalls" value="waterfalls">
        <calcite-action
          slot="actions-end"
          icon="layer"
          text="Waterfalls layer"
        ></calcite-action>
      </calcite-list-item>
      <calcite-list-item label="Rivers" value="rivers">
        <calcite-action
          slot="actions-end"
          icon="layer"
          text="Rivers layer"
        ></calcite-action>
      </calcite-list-item>
      <calcite-list-item label="Estuaries" value="estuaries">
        <calcite-action
          slot="actions-end"
          icon="layer"
          text="Estuaries layer"
        ></calcite-action>
      </calcite-list-item>
    </calcite-list>
  </body>
</html>
